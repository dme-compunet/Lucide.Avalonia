name: Update Icon Collection (Bot)

on:
  schedule:
    - cron: "0 4 * * 0"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write # push the commit and the new tag
      actions: write # dispatch release.yml for the new tag

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Nushell
        run: |
          curl -fsSL https://apt.fury.io/nushell/gpg.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/fury-nushell.gpg
          echo "deb https://apt.fury.io/nushell/ /" | sudo tee /etc/apt/sources.list.d/fury.list
          sudo apt update
          sudo apt install nushell

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Publishing is done by release.yml (NuGet Trusted Publishing),
      # this workflow only commits, tags and dispatches it.
      - name: Update icons
        run: nu .github/update-icons.nu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
